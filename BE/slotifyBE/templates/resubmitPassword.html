<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Slotify</title>
  <link rel="icon" href="https://i.postimg.cc/9FDXtjBK/Logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .glass-effect {
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .input-focus:focus {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    
    .btn-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(30, 129, 176, 0.4);
    }
    
    .fade-in {
      animation: fadeIn 0.8s ease-out;
    }
    
    .slide-up {
      animation: slideUp 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { 
        opacity: 0; 
        transform: translateY(30px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    .floating {
      animation: floating 3s ease-in-out infinite;
    }
    
    @keyframes floating {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .bg-pattern {
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .form-group label {
      transition: all 0.3s ease;
    }

    .form-group:focus-within label {
      color: #3b82f6;
      transform: scale(0.95);
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen flex">
  <!-- Left Panel - Hero Section -->
  <div class="w-1/2 relative gradient-bg bg-pattern">
    <div class="absolute inset-0 flex items-center justify-center p-12">
      <div class="text-center text-white fade-in">
        <div class="floating mb-8">
          <div class="w-20 h-20 mx-auto mb-6 rounded-2xl glass-effect flex items-center justify-center">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-5xl font-bold mb-6 leading-tight">
          Forgot Your
          <span class="block text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
            Password?
          </span>
        </h1>
        <p class="text-xl opacity-90 font-light max-w-md mx-auto leading-relaxed">
          No worries! Enter your email address and we'll send you a verification code to reset your password
        </p>
        <div class="mt-8 flex justify-center space-x-4">
          <div class="w-2 h-2 bg-white rounded-full opacity-50"></div>
          <div class="w-8 h-2 bg-white rounded-full"></div>
          <div class="w-2 h-2 bg-white rounded-full opacity-50"></div>
        </div>
      </div>
    </div>
    
    <!-- Decorative Elements -->
    <div class="absolute top-10 left-10 w-32 h-32 border border-white/20 rounded-full"></div>
    <div class="absolute bottom-10 right-10 w-24 h-24 border border-white/20 rounded-full"></div>
    <div class="absolute top-1/2 right-20 w-4 h-4 bg-white/30 rounded-full"></div>
  </div>

  <!-- Right Panel - Forgot Password Form -->
  <div class="w-1/2 h-screen overflow-y-auto bg-white flex items-center justify-center">
    <div class="max-w-md mx-auto w-full px-8 py-12 slide-up">
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <img src="https://i.postimg.cc/5tnjKtdq/Logo-BGRemoved.png" alt="Logo" class="w-20 h-20 mx-auto mb-4 floating">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">Reset Password</h2>
        <p class="text-gray-500 font-light">Enter your email to receive a verification code</p>
      </div>

      <!-- Forgot Password Form -->
      <form id="forgotPasswordForm" class="space-y-6">
        <div class="form-group stagger-1">
          <label for="emailId" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <div class="relative">
            <input 
              type="email" 
              id="emailId" 
              maxlength="255" 
              class="w-full p-4 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 input-focus bg-gray-50 focus:bg-white" 
              placeholder="Enter your email address"
              required
            >
            <div class="absolute inset-y-0 right-0 flex items-center pr-4">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-4 rounded-xl transition-all duration-300 btn-hover transform shadow-lg stagger-2"
        >
          <span class="flex items-center justify-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            Send Verification Code
          </span>
        </button>
      </form>

      <div class="mt-8 text-center stagger-3">
        <p class="text-gray-600">
          Remember your password? 
          <a href="/userSignIn" class="text-blue-600 font-semibold hover:text-blue-700 transition-colors">
            Sign in here
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotPasswordForm');

    // Form submission
    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const emailId = document.getElementById('emailId').value.trim();

      if (!emailId) {
        alert('Please enter your email address.');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailId)) {
        alert('Please enter a valid email address.');
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sending Code...
        </span>
      `;

      try {
        const response = await fetch('/forgot-password/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: emailId })
        });

        const responseData = await response.json();

        if (response.ok) {
          
          // Redirect to OTP verification page
          window.location.href = `/verify-email/?email=${encodeURIComponent(emailId)}&context=password_reset`;
        } else {
          let errorMessage = 'Failed to send verification code';
          if (response.status === 400) {
            errorMessage = responseData.error || 'Invalid email address';
          } else if (response.status === 404) {
            errorMessage = 'Email address not found';
          } else if (response.status === 500) {
            errorMessage = 'Server error occurred. Please try again later.';
          } else {
            errorMessage = responseData.error || 'An unexpected error occurred';
          }

          console.error('Failed to send reset email:', responseData);
          alert(`Error: ${errorMessage}`);
        }
      } catch (error) {
        console.error('Network error:', error);
        alert('Network error occurred. Please check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    });
  </script>
</body>

</html>
