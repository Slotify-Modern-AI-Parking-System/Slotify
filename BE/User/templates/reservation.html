<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Reservation</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes logoFloat {
            from { transform: translateY(-10px); }
            to { transform: translateY(10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        .animate-slideIn {
            animation: slideIn 1s ease-out;
        }

        .animate-fadeInUp {
            animation: fadeInUp 1s ease-out forwards;
        }

        .animate-logoFloat {
            animation: logoFloat 2s ease-in-out infinite alternate;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-pulse-custom {
            animation: pulse 2s ease-in-out infinite;
        }

        .animate-shimmer {
            animation: shimmer 2s infinite;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200px 100%;
        }

        .delay-500 { animation-delay: 0.5s; }
        .delay-1000 { animation-delay: 1s; }
        .delay-1500 { animation-delay: 1.5s; }
        .delay-2000 { animation-delay: 2s; }
        .delay-3000 { animation-delay: 3s; }
        .delay-4000 { animation-delay: 4s; }
        .delay-5000 { animation-delay: 5s; }

        .bg-gradient-navy-green {
            background: linear-gradient(135deg, #001f3f 0%, #2d5a2d 100%);
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: rgba(255, 255, 255, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        #card-element {
            padding: 15px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        #card-element:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .total-display {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-navy-green min-h-screen flex items-center justify-center py-8 px-4 font-sans">
    <!-- Background floating icons -->
    <div class="absolute inset-0 pointer-events-none z-0">
        <div class="absolute top-[10%] left-[10%] text-3xl text-white opacity-10 animate-float">🚗</div>
        <div class="absolute top-[20%] right-[15%] text-3xl text-white opacity-10 animate-float delay-1000">🅿️</div>
        <div class="absolute bottom-[30%] left-[20%] text-3xl text-white opacity-10 animate-float delay-2000">🚙</div>
        <div class="absolute bottom-[20%] right-[10%] text-3xl text-white opacity-10 animate-float delay-3000">🚕</div>
        <div class="absolute top-[50%] left-[5%] text-3xl text-white opacity-10 animate-float delay-4000">🚐</div>
        <div class="absolute top-[60%] right-[5%] text-3xl text-white opacity-10 animate-float delay-5000">🚓</div>
        <div class="absolute top-[30%] right-[30%] text-3xl text-white opacity-10 animate-float delay-2000">💳</div>
        <div class="absolute bottom-[40%] right-[25%] text-3xl text-white opacity-10 animate-float delay-3500">📍</div>
    </div>

    <!-- Main container -->
    <div class="form-card rounded-2xl p-8 w-full max-w-2xl mx-auto animate-slideIn z-10">
        <!-- Header with logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl font-bold text-white animate-logoFloat shadow-lg">
                S
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">Parking Reservation</h1>
            <p class="text-gray-600">Reserve your perfect parking spot with ease</p>
        </div>
        
        <form id="reservation-form" class="space-y-6 opacity-0 animate-fadeInUp delay-500">
            <!-- Name Field -->
            <div class="form-group">
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
                    <span class="mr-2">👤</span>
                    Full Name
                </label>
                <input type="text" id="name" name="name" required 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none"
                       placeholder="Enter your full name">
            </div>
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
                    <span class="mr-2">📧</span>
                    Email Address
                </label>
                <input type="email" id="email" name="email" required 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none"
                       placeholder="your.email@example.com">
            </div>
            
            <!-- License Plate Field -->
            <div class="form-group">
                <label for="license_plate" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
                    <span class="mr-2">🚗</span>
                    License Plate Number
                </label>
                <input type="text" id="license_plate" name="license_plate" required 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none uppercase tracking-wider font-mono"
                       placeholder="ABC123" style="text-transform: uppercase;">
            </div>
            
            <!-- Location Field -->
            <div class="form-group">
                <label for="location" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
                    <span class="mr-2">📍</span>
                    Parking Location Address
                </label>
                <input type="text" id="location" name="location" required 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none"
                       placeholder="Enter parking lot address">
            </div>
            
            <!-- Hours Selection -->
            <div class="form-group">
                <label for="hours" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
                    <span class="mr-2">⏰</span>
                    Parking Duration
                </label>
                <select id="hours" name="hours" required 
                        class="input-field w-full px-4 py-3 rounded-xl text-gray-800 focus:outline-none">
                    <option value="">Select parking duration</option>
                    <option value="1">1 Hour - $10</option>
                    <option value="2">2 Hours - $20</option>
                    <option value="3">3 Hours - $30</option>
                    <option value="4">4 Hours - $40</option>
                    <option value="5">5 Hours - $50</option>
                    <option value="6">6 Hours - $60</option>
                    <option value="8">8 Hours - $80</option>
                    <option value="12">12 Hours - $120</option>
                </select>
            </div>
            
            <!-- Total Display -->
            <div class="total-display text-center rounded-xl opacity-0" id="total-container" style="display: none;">
                <div id="total" class="text-2xl font-bold"></div>
                <p class="text-sm opacity-90 mt-1">Total Amount</p>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" 
                    class="btn-primary w-full py-4 px-6 rounded-xl text-white font-bold text-lg shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed">
                🔍 Find & Reserve Parking Spot
            </button>
        </form>
        
        <!-- Payment Section -->
        <div class="payment-section opacity-0 animate-fadeInUp" id="payment-section" style="display: none;">
            <div class="border-t border-gray-200 my-8"></div>
            
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 mb-2 flex items-center justify-center">
                    <span class="mr-2">💳</span>
                    Payment Information
                </h3>
                <p class="text-gray-600">Complete your reservation with secure payment</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Card Details
                </label>
                <div id="card-element"></div>
            </div>
            
            <button id="pay-button" 
                    class="btn-success w-full py-4 px-6 rounded-xl text-white font-bold text-lg shadow-lg focus:outline-none focus:ring-4 focus:ring-green-300">
                ✅ Complete Payment & Reserve Spot
            </button>
        </div>
    </div>

    <script>
        const stripe = Stripe('pk_test_51PwolR06rhYg2HRqmc2HLCJvlwMK9svb9xlKWxIqejbSsADYAQIDjooZY9zMb8aLOma3UXGJOMySDAiuXvZ80H4V00PAGNdYxv'); // Replace with your Stripe publishable key
        let elements, cardElement, clientSecret, reservationId;
        
        // Make license plate input uppercase
        document.getElementById('license_plate').addEventListener('input', function() {
            this.value = this.value.replace(/[^A-Z0-9]/g, '').toUpperCase();
        });
        
        // Handle hours selection and total calculation
        document.getElementById('hours').addEventListener('change', function() {
            const hours = this.value;
            const totalContainer = document.getElementById('total-container');
            
            if (hours) {
                const total = hours * 10;
                document.getElementById('total').textContent = `$${total}`;
                totalContainer.style.display = 'block';
                totalContainer.style.opacity = '1';
                totalContainer.classList.add('animate-fadeInUp');
            } else {
                totalContainer.style.display = 'none';
            }
        });
        
        // Handle form submission
        document.getElementById('reservation-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // Show loading state
            submitBtn.innerHTML = '🔄 Finding parking spot...';
            submitBtn.disabled = true;
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/create-reservation/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                const data = await response.json();
                
                if (data.client_secret) {
                    clientSecret = data.client_secret;
                    reservationId = data.reservation_id;
                    
                    alert('Parking lot found! ' + data.slot_info);
                    
                    // Initialize Stripe Elements
                    elements = stripe.elements();
                    cardElement = elements.create('card', {
                        style: {
                            base: {
                                fontSize: '16px',
                                color: '#424770',
                                '::placeholder': {
                                    color: '#aab7c4',
                                },
                            },
                        },
                    });
                    cardElement.mount('#card-element');
                    
                    // Show payment section with animation
                    document.getElementById('payment-section').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('payment-section').style.opacity = '1';
                    }, 100);
                    
                    // Hide form
                    this.style.display = 'none';
                } else {
                    alert('Error: ' + data.error);
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('Error: ' + error.message);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
    // Retrieve email from localStorage
    const savedEmail = localStorage.getItem('user_email');
    
    // Pre-fill the email field if email exists in localStorage
    if (savedEmail) {
        document.getElementById('email').value = savedEmail;
    }
});

        
        // Handle payment
        document.getElementById('pay-button').addEventListener('click', async function() {
            const payBtn = this;
            const originalText = payBtn.innerHTML;
            
            // Show loading state
            payBtn.innerHTML = '🔄 Processing payment...';
            payBtn.disabled = true;
            
            const {error, paymentIntent} = await stripe.confirmCardPayment(clientSecret, {
                payment_method: {
                    card: cardElement
                }
            });
            
            if (error) {
                alert('Payment failed: ' + error.message);
                payBtn.innerHTML = originalText;
                payBtn.disabled = false;
            } else {
                // Payment succeeded
                payBtn.innerHTML = '✅ Payment successful!';
                
                const response = await fetch('/payment-success/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        payment_intent_id: paymentIntent.id
                    })
                });
                
                const result = await response.json();
                alert(result.message || 'Payment successful! Your parking slot is reserved.');
                
                setTimeout(() => {
                    location.reload();
                }, 2000);
            }
        });
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
