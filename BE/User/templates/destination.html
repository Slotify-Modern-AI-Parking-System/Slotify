<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slotify - Smart Parking Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeInUp {
            from { transform: translateY(25px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0,0,0); }
            40%, 43% { transform: translate3d(0, -30px, 0); }
            70% { transform: translate3d(0, -15px, 0); }
            90% { transform: translate3d(0, -4px, 0); }
        }

        @keyframes morphSpin {
            0% { transform: rotate(0deg) scale(1); border-radius: 50%; }
            50% { transform: rotate(180deg) scale(1.1); border-radius: 20%; }
            100% { transform: rotate(360deg) scale(1); border-radius: 50%; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        }

        .animate-slideIn { animation: slideIn 0.8s ease-out; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-gentle { animation: pulse 3s ease-in-out infinite; }
        .animate-fadeInUp { animation: fadeInUp 0.6s ease-out; }
        .animate-bounce-gentle { animation: bounce 2s infinite; }
        .animate-morphSpin { animation: morphSpin 2s linear infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }

        .bg-gradient-navy-green {
            background: linear-gradient(135deg, #001f3f 0%, #2d5a2d 100%);
        }

        .bg-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .delay-200 { animation-delay: 0.2s; }
        .delay-400 { animation-delay: 0.4s; }

        .loading-wave {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            animation: bounce 1.4s ease-in-out infinite both;
        }
        .loading-wave:nth-child(1) { animation-delay: -0.32s; }
        .loading-wave:nth-child(2) { animation-delay: -0.16s; }
        .loading-wave:nth-child(3) { animation-delay: 0s; }

        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .progress-bar {
            width: 0%;
            transition: width 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-navy-green min-h-screen flex items-center justify-center p-4 font-sans">
    <!-- Floating elements -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[15%] left-[8%] w-12 h-12 bg-glass rounded-2xl flex items-center justify-center text-2xl animate-float animate-glow">🚗</div>
        <div class="absolute top-[25%] right-[12%] w-12 h-12 bg-glass rounded-2xl flex items-center justify-center text-2xl animate-float">🅿️</div>
        <div class="absolute bottom-[35%] left-[15%] w-12 h-12 bg-glass rounded-2xl flex items-center justify-center text-2xl animate-float">🚙</div>
        <div class="absolute bottom-[25%] right-[8%] w-12 h-12 bg-glass rounded-2xl flex items-center justify-center text-2xl animate-float">🚕</div>
    </div>

    <!-- Main container -->
    <div class="bg-white bg-opacity-10 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white border-opacity-20 p-8 w-full max-w-lg animate-slideIn relative z-10">
        
        <!-- Selection Screen -->
        <div id="selectionScreen" class="text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl text-white animate-pulse-gentle animate-glow">
                    🎯
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Find Your Spot</h1>
                <p class="text-white text-opacity-80">Choose your parking experience</p>
            </div>

            <div class="space-y-4">
                <button onclick="selectParkingType('Regular')" 
                        class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-5 px-6 rounded-2xl hover-lift shadow-xl transition-all duration-300">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="text-2xl mr-3">🚗</span>
                            <div class="text-left">
                                <span class="text-lg font-bold block">Regular Parking</span>
                                <span class="text-blue-100 text-sm">Standard spots</span>
                            </div>
                        </div>
                        <span class="text-xl">→</span>
                    </div>
                </button>

                <button onclick="selectParkingType('Accessible')" 
                        class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-5 px-6 rounded-2xl hover-lift shadow-xl transition-all duration-300 delay-200 animate-fadeInUp">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="text-2xl mr-3">♿</span>
                            <div class="text-left">
                                <span class="text-lg font-bold block">Accessible Parking</span>
                                <span class="text-green-100 text-sm">Wheelchair friendly</span>
                            </div>
                        </div>
                        <span class="text-xl">→</span>
                    </div>
                </button>

                <button onclick="selectParkingType('Reserved')" 
                        class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold py-5 px-6 rounded-2xl hover-lift shadow-xl transition-all duration-300 delay-400 animate-fadeInUp">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="text-2xl mr-3">⭐</span>
                            <div class="text-left">
                                <span class="text-lg font-bold block">Reserved Parking</span>
                                <span class="text-purple-100 text-sm">Premium VIP</span>
                            </div>
                        </div>
                        <span class="text-xl">→</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="hidden text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl text-white animate-morphSpin shadow-2xl">
                    🔍
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Finding Your Spot...</h2>
                <p class="text-white text-opacity-80 mb-4" id="loadingMessage">Scanning available spots</p>
                
                <div class="w-full bg-white bg-opacity-20 rounded-full h-2 mb-4">
                    <div id="progressBar" class="progress-bar bg-gradient-to-r from-blue-400 to-purple-500 h-2 rounded-full"></div>
                </div>
            </div>

            <div class="flex justify-center items-center space-x-3">
                <div class="loading-wave"></div>
                <div class="loading-wave"></div>
                <div class="loading-wave"></div>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="successScreen" class="hidden text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-600 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl text-white animate-bounce-gentle animate-glow">
                    🎉
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">
                    Spot <span id="assignedSlot" class="text-green-400 text-3xl font-extrabold animate-pulse-gentle"></span> is Ready!
                </h2>
                <p class="text-white text-opacity-80">Your parking spot awaits!</p>
            </div>

            <!-- Slot Details -->
            <div class="bg-green-500 bg-opacity-20 backdrop-blur-lg border border-green-400 border-opacity-30 rounded-2xl p-5 mb-6 animate-fadeInUp">
                <div class="flex items-center justify-center mb-3">
                    <span class="text-3xl mr-2">🅿️</span>
                    <span class="text-lg font-bold text-white">Zone <span id="assignedZone" class="text-green-400"></span></span>
                </div>
                <div class="text-center">
                    <div class="text-lg font-bold text-green-400" id="selectedParkingType"></div>
                    <div class="text-white text-opacity-70 text-sm">parking type</div>
                </div>
            </div>

            <!-- Directions -->
            <div class="mb-6">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-center">
                    <span class="text-2xl mr-2">🧭</span> Directions
                </h3>
                <div class="bg-blue-500 bg-opacity-20 backdrop-blur-lg border border-blue-400 border-opacity-30 rounded-2xl p-4">
                    <div class="flex items-center justify-center">
                        <span class="text-2xl mr-3" id="directionIcon">📍</span>
                        <span class="text-white font-medium" id="directions"></span>
                    </div>
                </div>
            </div>

            <!-- Final Message -->
            <div class="bg-blue-500 bg-opacity-20 backdrop-blur-lg border border-blue-400 border-opacity-30 rounded-2xl p-4 animate-fadeInUp">
                <div class="flex items-center justify-center mb-2">
                    <span class="text-2xl mr-2">🛡️</span>
                    <span class="text-lg font-bold text-white">Safe Parking!</span>
                </div>
                <p class="text-white text-opacity-80 text-sm">Drive safely and enjoy your visit!</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-white text-opacity-60 text-sm">✨ Slotify - Smart Parking Experience</p>
        </div>
    </div>

    <script>
        let selectedType = '';
        
        const loadingMessages = [
            "Scanning available spots...",
            "Analyzing parking zones...", 
            "Finding optimal location...",
            "Almost ready!"
        ];

        function selectParkingType(type) {
            selectedType = type;
            showLoadingScreen();
            animateProgressBar();
            
            // Cycle through loading messages
            let messageIndex = 0;
            const messageInterval = setInterval(() => {
                if (messageIndex < loadingMessages.length) {
                    document.getElementById('loadingMessage').innerHTML = loadingMessages[messageIndex];
                    messageIndex++;
                }
            }, 1000);

            // Call API after 4 seconds
            setTimeout(() => {
                clearInterval(messageInterval);
                assignSlot(type);
            }, 4000);
        }

        function animateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                } else {
                    width += 2.5; // Complete in 4 seconds
                    progressBar.style.width = width + '%';
                }
            }, 100);
        }

        function showLoadingScreen() {
            document.getElementById('selectionScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');
        }

        function showSuccessScreen() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
            
            // Auto-close after 8 seconds
            setTimeout(() => {
                window.close();
            }, 8000);
        }
        function assignSlot(type) {
    // Get lotId from sessionStorage or use default
    const lotId = localStorage.getItem('lotId') || 21;
    
    const requestBody = {
        type: type,
        lotId: parseInt(lotId)
    };

    fetch('/api/assign-slot/', {  // Added trailing slash here
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(requestBody)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displaySlotAssignment(data);
        } else {
            showError(data.message || 'Failed to assign slot');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showError('Network error occurred');
    });
}

       
        function displaySlotAssignment(data) {
            const slot = data.slot;
            
            // Update slot information
            document.getElementById('assignedSlot').textContent = slot.label;
            document.getElementById('assignedZone').textContent = slot.zone;
            document.getElementById('selectedParkingType').textContent = selectedType;
            document.getElementById('directions').textContent = slot.directions;
            
            // Set direction icon based on directions
            const directionIcon = getDirectionIcon(slot.directions);
            document.getElementById('directionIcon').textContent = directionIcon;
            
            showSuccessScreen();
        }

        function getDirectionIcon(direction) {
            const text = direction.toLowerCase();
            
            if (text.includes('right')) return '➡️';
            if (text.includes('left')) return '⬅️';
            if (text.includes('straight')) return '⬆️';
            if (text.includes('back')) return '⬇️';
            
            return '📍';
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-500 bg-opacity-90 text-white p-4 rounded-xl shadow-2xl z-50';
            errorDiv.innerHTML = `
                <div class="flex items-center">
                    <span class="text-xl mr-2">❌</span>
                    <span class="font-semibold">${message}</span>
                </div>
            `;
            
            document.body.appendChild(errorDiv);
            
            // Auto remove error and reset
            setTimeout(() => {
                errorDiv.remove();
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('selectionScreen').classList.remove('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
